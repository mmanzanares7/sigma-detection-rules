title: Office Application Spawns Command Shell or Script Host
id: cd5a8e4d-be4c-5880-aca7-73b9f561bee9
status: experimental
description: Detects Word, Excel, PowerPoint or Outlook starting a command shell or script host. Malicious macros commonly do this to run their next stage.
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: mmanzanares7
date: 2026/10/30
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        ParentImage|endswith:
            - '\winword.exe'
            - '\excel.exe'
            - '\powerpnt.exe'
            - '\outlook.exe'
        Image|endswith:
            - '\cmd.exe'
            - '\powershell.exe'
            - '\pwsh.exe'
            - '\wscript.exe'
            - '\cscript.exe'
            - '\mshta.exe'
    condition: selection
falsepositives:
    - Legacy macros that automate business tasks by calling a shell
    - Add-ins that launch helper scripts
level: high
