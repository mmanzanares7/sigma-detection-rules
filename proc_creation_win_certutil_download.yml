title: File Download With certutil
id: a3f17530-1570-5fa2-a496-c98721a80300
status: experimental
description: Detects certutil used with -urlcache to fetch a file from a URL. This is a known way to download tools using a built-in program.
references:
    - https://attack.mitre.org/techniques/T1105/
author: mmanzanares7
date: 2026/10/30
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\certutil.exe'
    selection_cmd:
        CommandLine|contains|all:
            - '-urlcache'
            - 'http'
    condition: selection_img and selection_cmd
falsepositives:
    - Rare administrative use to fetch certificate revocation lists
level: medium
