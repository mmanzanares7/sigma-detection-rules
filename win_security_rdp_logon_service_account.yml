title: Remote Desktop Logon by a Service Account
id: f2a07cd2-71bd-5399-93af-16a495d0db7e
status: experimental
description: Detects an interactive remote desktop logon (type 10) by an account whose name starts with svc_. Service accounts normally authenticate in the background and should not log on interactively.
references:
    - https://attack.mitre.org/techniques/T1021/001/
    - https://attack.mitre.org/techniques/T1078/
author: mmanzanares7
date: 2026/10/30
tags:
    - attack.lateral_movement
    - attack.t1021.001
    - attack.t1078
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 10
        TargetUserName|startswith: 'svc_'
    condition: selection
falsepositives:
    - Vendors or administrators who sign in to a service account for maintenance (should be documented and ticketed)
level: medium
